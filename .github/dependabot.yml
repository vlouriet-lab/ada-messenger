version: 2
updates:
  # Зависимости GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  # Зависимости Rust (Cargo)
  - package-ecosystem: cargo
    directory: /ada-core
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(rust)"
    # Не открывать PR для мажорных обновлений автоматически
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Зависимости Gradle (Android + Desktop)
  - package-ecosystem: gradle
    directory: /android-app
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(android)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
