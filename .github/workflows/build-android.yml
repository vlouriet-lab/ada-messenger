# CI-пайплайн: сборка Android APK и тестирование Rust-ядра.
#
# Срабатывает при пуше в main/develop, при теге v* и вручную (workflow_dispatch).
# Результат каждой сборки main — подписанный APK в артефактах (30 дней хранения).
# Для полного релиза с GitHub Release используйте release.yml.

name: Build & Release ADA Android APK

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Сборка нативных библиотек Rust (параллельно для каждого ABI)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-core:
    name: Rust core / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android

    steps:
      - uses: actions/checkout@v5

      - name: Установка Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      # android-actions/setup-android устанавливает Android SDK + NDK корректно.
      # Заменяет несуществующий ndk-build/ndk-build action.
      - uses: android-actions/setup-android@v4

      - name: Установка cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Сборка libada_core.so (${{ matrix.target }})
        working-directory: ada-core
        run: |
          cargo ndk -t ${{ matrix.target }} build --features mobile --release
          ls -lh target/${{ matrix.target }}/release/libada_core.so

      - name: Загрузка .so как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: libada_core-${{ matrix.target }}
          path: ada-core/target/${{ matrix.target }}/release/libada_core.so
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Сборка Android-приложения + подписанный APK
# ─────────────────────────────────────────────────────────────────────────────
  build-android-app:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    needs: build-core

    steps:
      - uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Загрузка Rust-артефактов
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Размещение .so файлов по ABI
        run: |
          mkdir -p android-app/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          cp artifacts/libada_core-aarch64-linux-android/libada_core.so \
             android-app/app/src/main/jniLibs/arm64-v8a/
          cp artifacts/libada_core-armv7-linux-androideabi/libada_core.so \
             android-app/app/src/main/jniLibs/armeabi-v7a/
          cp artifacts/libada_core-x86_64-linux-android/libada_core.so \
             android-app/app/src/main/jniLibs/x86_64/
          ls -lh android-app/app/src/main/jniLibs/**/*.so

      # Декодируем keystore из секрета — для подписи quasiRelease APK.
      - name: Декодирование keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/ada-release-key.jks

      - name: Запись local.properties для подписи
        run: |
          cat > android-app/local.properties << 'EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          signing.storeFile=ada-release-key.jks
          signing.storePassword=$STORE_PASS
          signing.keyAlias=ada-key
          signing.keyPassword=$KEY_PASS
          EOF
          sed -i "s|\$ANDROID_SDK_ROOT|$ANDROID_SDK_ROOT|g" android-app/local.properties
          sed -i "s|\$STORE_PASS|${{ secrets.ANDROID_KEYSTORE_PASSWORD }}|g" android-app/local.properties
          sed -i "s|\$KEY_PASS|${{ secrets.ANDROID_KEY_PASSWORD }}|g" android-app/local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Разрешение на выполнение gradlew
        run: chmod +x android-app/gradlew

      - name: Сборка debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --console=plain --no-daemon

      # quasiRelease = release-оптимизация + подпись keystore-ом.
      # Флаг -Pada.skipNativeBuild=true — .so уже скопированы выше.
      - name: Сборка и подпись quasiRelease APK
        working-directory: android-app
        run: |
          ./gradlew assembleQuasiRelease \
            -Pada.skipNativeBuild=true \
            --console=plain --no-daemon

      - name: Загрузка debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ada-messenger-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Подписанный APK доступен в артефактах каждой успешной сборки main.
      # Скачать: Actions → выбрать запуск → Artifacts → ada-messenger-signed
      - name: Загрузка подписанного APK
        uses: actions/upload-artifact@v4
        with:
          name: ada-messenger-signed
          path: android-app/app/build/outputs/apk/quasiRelease/*.apk
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Тестирование Rust-ядра
# ─────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Тесты Rust-ядра
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      - name: Unit-тесты и интеграционные тесты
        working-directory: ada-core
        run: cargo test --no-default-features --features mobile-dev --lib --tests -- --nocapture

      - name: Интеграционные тесты (без hostile-network)
        working-directory: ada-core
        run: |
          cargo test --no-default-features --features mobile-dev \
            --test integration -- --nocapture --skip hostile_network_

      - name: Тесты hostile-network harness
        working-directory: ada-core
        run: |
          cargo test --no-default-features --features mobile-dev \
            --test integration hostile_network_ -- --nocapture

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: Аудит безопасности зависимостей
# ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Аудит безопасности
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      - name: Установка cargo-audit
        run: cargo install cargo-audit --locked

      # Информационный режим — не блокирует CI при наличии advisory.
      # Уязвимости выводятся в лог для ручного анализа.
      - name: Проверка уязвимостей зависимостей
        working-directory: ada-core
        continue-on-error: true
        run: cargo audit

# ─────────────────────────────────────────────────────────────────────────────
# Job 5: Android Lint
# ─────────────────────────────────────────────────────────────────────────────
  lint-android:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Разрешение на выполнение gradlew
        run: chmod +x android-app/gradlew

      - name: Запуск Android Lint
        working-directory: android-app
        continue-on-error: true
        run: ./gradlew :app:lintDebug --console=plain --no-daemon

# ─────────────────────────────────────────────────────────────────────────────
# Job 6: Draft-релиз при теге (только debug APK, полный релиз — через release.yml)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Draft Release (тег)
    runs-on: ubuntu-latest
    needs: [build-android-app, test-core, security-audit, lint-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Скачивание артефактов
        uses: actions/download-artifact@v8

      - name: GitHub Release (черновик)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ada-messenger-debug/app-debug.apk
          body: |
            > **Примечание**: Это автоматически собранный **debug APK** из CI.
            > Для подписанного production APK + Windows-инсталлятора запустите
            > [Release workflow](../../actions/workflows/release.yml) вручную из вкладки Actions.
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

