# CI-пайплайн: сборка Windows-инсталлятора ADA Messenger.
#
# Использует фичу `desktop` (Cargo) — JNI для Compose Desktop без android_logger,
# который компилируется только для Android и ломает сборку на Windows.
#
# Срабатывает при пуше в main, при теге v* и вручную (workflow_dispatch).
# Инсталлятор публикуется в артефактах; при теге — прикрепляется к релизу.

name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Сборка Windows-инсталлятора
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      - name: Установка CMake 3.29 (fix для audiopus_sys)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.x'

      - name: Установка NSIS
        run: choco install nsis -y

      # Флаг -SkipSigning: подпись code-signing сертификатом не нужна в CI.
      # Используется фича `desktop` (без android_logger) — корректно компилируется на Windows.
      # CMAKE_POLICY_VERSION_MINIMUM=3.5 нужен для audiopus_sys на CMake 4.x (runner 2026).
      - name: Сборка инсталлятора (без подписи)
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: ./build-installer-windows.ps1 -SkipSigning

      - name: Загрузка инсталлятора как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ada-messenger-windows-installer
          path: releases/*.exe
          if-no-files-found: error

      # При теге — прикрепляем инсталлятор к GitHub Release автоматически.
      - name: Прикрепление инсталлятора к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

