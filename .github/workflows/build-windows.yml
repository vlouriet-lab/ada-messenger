# CI-пайплайн: сборка Windows-инсталлятора ADA Messenger.
#
# Использует фичу `desktop` (Cargo) — JNI для Compose Desktop без android_logger,
# который компилируется только для Android и ломает сборку на Windows.
#
# Срабатывает при пуше в main, при теге v* и вручную (workflow_dispatch).
# Инсталлятор публикуется в артефактах; при теге — прикрепляется к релизу.

name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Сборка Windows-инсталлятора
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      - name: Установка NSIS
        run: choco install nsis -y

      # audiopus_sys пытается собрать Opus через CMake, но CMake 4.x (VS 2026)
      # несовместим со старым cmake_minimum_required(VERSION 2.8) в исходниках Opus.
      # Решение: собираем Opus через vcpkg заранее и указываем путь через LIBOPUS_LIB_DIR.
      # audiopus_sys при наличии LIBOPUS_LIB_DIR полностью пропускает CMake.
      - name: Установка Opus через vcpkg (fix CMake 4.x)
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static
          $opusLib = "C:\vcpkg\installed\x64-windows-static"
          echo "LIBOPUS_LIB_DIR=$opusLib" >> $env:GITHUB_ENV
          echo "OPUS_STATIC=1" >> $env:GITHUB_ENV

      - name: Сборка инсталлятора (без подписи)
        shell: pwsh
        run: ./build-installer-windows.ps1 -SkipSigning

      - name: Загрузка инсталлятора как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ada-messenger-windows-installer
          path: releases/*.exe
          if-no-files-found: error

      # При теге — прикрепляем инсталлятор к GitHub Release автоматически.
      - name: Прикрепление инсталлятора к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

