# Единый pipeline релиза: строит подписанный APK + Windows-инсталлятор,
# публикует их как GitHub Release.
#
# Срабатывает при пуше тега вида v0.3.1 или вручную (workflow_dispatch).
#
# Необходимые GitHub Secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   — base64-кодировка файла ada-release-key.jks
#   ANDROID_KEYSTORE_PASSWORD — пароль хранилища ключей
#   ANDROID_KEY_PASSWORD      — пароль ключа (для PKCS12 совпадает с паролем хранилища)
#
# Все три секрета обязательны для подписанного Android APK.
# Windows-инсталлятор строится без code-signing сертификата (-SkipSigning).

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.1)'
        required: true

env:
  RUST_BACKTRACE: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Rust native libs для Android (параллельно по ABI)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-android-core:
    name: Rust core / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - aarch64-linux-android    # ARM64 — современные устройства
          - armv7-linux-androideabi  # 32-bit ARM — старые устройства
          - x86_64-linux-android     # эмулятор x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libada_core.so
        working-directory: ada-core
        run: |
          cargo ndk -t ${{ matrix.target }} build --features mobile --release
          ls -lh target/${{ matrix.target }}/release/libada_core.so

      - uses: actions/upload-artifact@v4
        with:
          name: libada_core-${{ matrix.target }}
          path: ada-core/target/${{ matrix.target }}/release/libada_core.so
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Сборка и подпись Android APK
# ─────────────────────────────────────────────────────────────────────────────
  build-android-apk:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    needs: build-android-core

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place .so files
        run: |
          mkdir -p android-app/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          cp artifacts/libada_core-aarch64-linux-android/libada_core.so \
             android-app/app/src/main/jniLibs/arm64-v8a/libada_core.so
          cp artifacts/libada_core-armv7-linux-androideabi/libada_core.so \
             android-app/app/src/main/jniLibs/armeabi-v7a/libada_core.so
          cp artifacts/libada_core-x86_64-linux-android/libada_core.so \
             android-app/app/src/main/jniLibs/x86_64/libada_core.so

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/ada-release-key.jks

      - name: Write local.properties
        run: |
          cat > android-app/local.properties << 'EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          signing.storeFile=ada-release-key.jks
          signing.storePassword=$STORE_PASS
          signing.keyAlias=ada-key
          signing.keyPassword=$KEY_PASS
          EOF
          sed -i "s|\$ANDROID_SDK_ROOT|$ANDROID_SDK_ROOT|g" android-app/local.properties
          sed -i "s|\$STORE_PASS|$STORE_PASS|g"             android-app/local.properties
          sed -i "s|\$KEY_PASS|$KEY_PASS|g"                 android-app/local.properties
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS:   ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: gradle/actions/setup-gradle@v3

      - name: Build quasiRelease APK
        working-directory: android-app
        run: |
          ./gradlew :app:assembleQuasiRelease \
            -Pada.skipNativeBuild=true \
            --console=plain --no-daemon

      - name: Rename APK
        run: |
          TAG="${{ github.ref_name }}"
          [[ -z "$TAG" ]] && TAG="${{ inputs.tag }}"
          [[ -z "$TAG" ]] && TAG="manual"
          APK_SRC=$(find android-app/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK_SRC" "ada-messenger-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ada-messenger-*.apk

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Windows installer
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ada-core

      - name: Install NSIS
        run: choco install nsis --yes

      - name: Build installer
        shell: pwsh
        run: ./build-installer-windows.ps1 -SkipSigning

      - name: Rename installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "${{ inputs.tag }}" }
          if (-not $tag) { $tag = "manual" }
          $src = Get-ChildItem releases\*.exe | Select-Object -First 1
          if ($src) {
            Rename-Item $src.FullName "ADA-Messenger-Setup-${tag}.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: releases\*.exe
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: Публикация GitHub Release (только для тегов)
# ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-apk, build-windows]
    permissions:
      contents: write   # нужно для создания/редактирования releases

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          [[ -z "$TAG" ]] && TAG="${{ inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ADA Messenger ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'alpha') || contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            dist/android-apk/*.apk
            dist/windows-installer/*.exe
          body: |
            ## Установка / Install

            **Android** — скачайте `.apk` ниже, включите *Установка из неизвестных источников*
            для вашего браузера или файлового менеджера, затем откройте файл.
            Или через ADB: `adb install -r ada-messenger-${{ steps.tag.outputs.tag }}.apk`

            **Windows** — скачайте и запустите `ADA-Messenger-Setup-${{ steps.tag.outputs.tag }}.exe`.
            Windows SmartScreen может показать *Подробнее → Выполнить* (сборка без EV-сертификата).

            Полные инструкции: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)

            ---
            Этот релиз собран автоматически из коммита `${{ github.sha }}`.
            Исходный код: [zip](https://github.com/${{ github.repository }}/archive/${{ steps.tag.outputs.tag }}.zip) · [tar.gz](https://github.com/${{ github.repository }}/archive/${{ steps.tag.outputs.tag }}.tar.gz)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
